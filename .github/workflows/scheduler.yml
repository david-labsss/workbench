name: Scheduler

# ONE scheduler per account, instead of a separate cron in every scraper. At the start of the
# daily window (06:00 Asia/Karachi = 01:00 UTC) this dispatches every scraper THIS account owns and
# runs them through the morning. "Owns" = the scraper's job guard carries
# `github.repository_owner == '<this account>'`, so each account only starts its own sites; the file
# is identical on every repo but each copy schedules a different set. Heaviest sites are started
# first so the long ones finish within the window.
#
# Why one scheduler and not a cron per site: the per-site crons created a "skipped" scheduled run on
# every OTHER account for every site every day (one file lives on all repos). This replaces ~130
# per-site schedules with one. Weekly full runs (gotodirect, servertechcentral-full, aztekc) keep
# their own weekly cron and are skipped here (they still carry a cron).
#
# Resilience: when an account is suspended, scripts/rehome.py rewrites the owner guard of its sites
# to a living account, and that account's scheduler then starts them -- nothing else to change.

on:
  schedule:
    - cron: "0 1 * * *"      # 06:00 Asia/Karachi
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated site keys to dispatch (blank = all this account's daily sites)"
        required: false
        default: ""

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduler-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch this account's scrapers
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ONLY: ${{ inputs.only }}
        run: |
          set -u
          cd .github/workflows
          if [ -n "${ONLY:-}" ]; then
            sites=$(echo "$ONLY" | tr ',' ' ')
          else
            # Every scraper this account owns that no longer carries its own cron (daily sites),
            # heaviest first so long jobs start at the top of the window.
            sites=$(for f in *.yml; do
              base="${f%.yml}"
              case "$base" in scheduler|setup-db|update-scrape-status|directmacro-qa) continue;; esac
              grep -q "repository_owner == '$OWNER'" "$f" || continue
              grep -qE '^\s*- cron:' "$f" && continue      # weekly fulls self-schedule
              to=$(grep -oE 'timeout-minutes:[[:space:]]*[0-9]+' "$f" | grep -oE '[0-9]+' | head -1)
              printf '%06d %s\n' "${to:-60}" "$base"
            done | sort -rn | awk '{print $2}')
          fi
          [ -n "${sites:-}" ] || { echo "no sites to dispatch for $OWNER"; exit 0; }
          n=0
          for base in $sites; do
            if [ ! -f "$base.yml" ]; then echo "::warning::$base.yml not found"; continue; fi
            if gh workflow run "$base.yml" >/dev/null 2>&1; then
              echo "dispatched $base"; n=$((n+1))
            else
              echo "::warning::could not dispatch $base"
            fi
            sleep 45
          done
          echo "dispatched $n site(s) for $OWNER"
