name: Scheduler
run-name: >-
  Scheduler ${{ inputs.only && format('only {0}', inputs.only) || (github.event.schedule == '0 12 * * *' && 'evening' || inputs.slot || 'morning') }}

# ONE scheduler per account. At 05:17 Asia/Karachi (00:17 UTC) it reads ops/scrape_schedule.json,
# takes the sites THIS account owns, and dispatches them spread over the next 5 hours
# (heaviest first, a few minutes apart) via ops/dispatch_schedule.py. Most sites run through the
# shared scrape.yml; a couple keep their own workflow. This replaces the per-site crons: one
# scheduled workflow per account, no "skipped" scheduled-run flood, load spread through the morning.
#
# Resilience: when an account is suspended, scripts/rehome.py reassigns its sites in
# scrape_schedule.json (and the few remaining per-site guards) to a living account.
#
# A second run at 17:00 Asia/Karachi dispatches only the sites with "slot": "evening" in
# scrape_schedule.json (our own store, read after the US IT pricing job has changed its prices).
#
# On time (2026-11-21): GitHub starts scheduled runs late, about 1 h on most accounts and about 7 h
# on 3 of them (11-20 and 11-21). A dispatched run starts within seconds, so an outside timer (the
# scrapers' n8n, "Scrapers - Scheduler on time") dispatches this workflow with `slot` at 05:17 and
# 17:00 PKT on every account. The crons below stay as the backup: a run finds the same slot already
# started in the last 20 hours and dispatches nothing (ops/dispatch_schedule.py), so no store is
# scraped twice. The run's name says its slot ("Scheduler morning"), which that check reads.

on:
  schedule:
    # 05:17 Asia/Karachi: the morning sites. Not on the hour: GitHub delays scheduled runs most at the
    # start of every hour (its docs), and ours usually started about 1 h late; on 2026-11-20 it was
    # 7 h late on 3 accounts, after the 12:50 US IT price run. 05:17 = off the hourly rush + 1 h earlier.
    - cron: "17 0 * * *"
    - cron: "0 12 * * *"     # 17:00 Asia/Karachi: the evening sites
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated site keys to dispatch now (blank = all this account's sites)"
        required: false
        default: ""
      slot:
        description: "Which sites: morning (05:17 PKT) or evening (17:00 PKT)"
        required: false
        default: "morning"
        type: choice
        options: [morning, evening]

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduler-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requests
        run: pip install requests

      - name: Dispatch this account's scrapers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          SLOT: ${{ github.event.schedule == '0 12 * * *' && 'evening' || inputs.slot || 'morning' }}
        run: python -u ops/dispatch_schedule.py
