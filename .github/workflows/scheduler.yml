name: Scheduler

# ONE scheduler per account. At 06:00 Asia/Karachi (01:00 UTC) it reads ops/scrape_schedule.json,
# takes the sites THIS account owns, and dispatches them spread across the 06:00-12:00 window
# (heaviest first, a few minutes apart) via ops/dispatch_schedule.py. Most sites run through the
# shared scrape.yml; a couple keep their own workflow. This replaces the per-site crons: one
# scheduled workflow per account, no "skipped" scheduled-run flood, load spread through the morning.
#
# Resilience: when an account is suspended, scripts/rehome.py reassigns its sites in
# scrape_schedule.json (and the few remaining per-site guards) to a living account.

on:
  schedule:
    - cron: "0 1 * * *"      # 06:00 Asia/Karachi
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated site keys to dispatch now (blank = all this account's sites)"
        required: false
        default: ""

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduler-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requests
        run: pip install requests

      - name: Dispatch this account's scrapers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
        run: python -u ops/dispatch_schedule.py
