name: Scrape Office Crave

# Started by n8n through the GitHub API (workflow_dispatch), or by hand from the Actions tab.
on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      max_products:
        description: "Only scrape about N products (blank = all). Use for test runs."
        required: false
        default: ""
      dry_run:
        description: "1 = print sample rows only, don't save to the database"
        required: false
        default: "0"

concurrency:
  group: scrape-officecrave
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'Bens-labsss'
    timeout-minutes: 30
    env:
      N8N_WEBHOOK_URL: ${{ secrets.TIER2_N8N_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_PRODUCTS: ${{ inputs.max_products }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -u -m officecrave.scrape

      - name: Report result to n8n
        if: always() && env.N8N_WEBHOOK_URL != ''
        env:
          STATUS: ${{ steps.scrape.outcome }}
          ROWS: ${{ steps.scrape.outputs.rows }}
          PRODUCTS: ${{ steps.scrape.outputs.products }}
          IN_STOCK: ${{ steps.scrape.outputs.in_stock }}
          RESTOCKED: ${{ steps.scrape.outputs.restocked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Don't spend Actions minutes on a hung n8n (on 2026-10-13 it hung up to 2.5 min, then sent a 502)
          curl -sS --max-time 20 -X POST "$N8N_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"site\":\"officecrave\",\"status\":\"$STATUS\",\"rows\":\"$ROWS\",\"products\":\"$PRODUCTS\",\"in_stock\":\"$IN_STOCK\",\"restocked\":\"$RESTOCKED\",\"run_url\":\"$RUN_URL\"}" || echo "::warning::n8n did not answer within 20 s"
