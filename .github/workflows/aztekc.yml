name: Scrape Aztek Computers

# Two cadences, one scraper (see aztekc/scrape.py):
#  * daily  (n8n workflow_dispatch): walk listings for price; carry real stock forward from the
#            last full run. Fast, light.
#  * weekly (schedule, FULL pass): also fetch every product page to read real availability from its
#            JSON-LD. Heavy (~141k pages), so once a week. The single-account guard keeps the cron
#            from firing on all five mirror repos; manual dispatch still works anywhere.
on:
  schedule:
    - cron: "0 1 * * 0"          # Sundays 12:00 UTC: weekly real-stock reconciliation (FULL)
    - cron: "0 1 * * *"          # daily 23:00 UTC: light price pass (real stock carried forward)
  workflow_dispatch:
    inputs:
      max_products:
        description: "Only scrape about N products (blank = all). Use for test runs."
        required: false
        default: ""
      dry_run:
        description: "1 = print sample rows only, don't save to the database"
        required: false
        default: "0"
      full:
        description: "1 = FULL pass (read real availability from every product page). Blank/0 = daily light pass."
        required: false
        default: "0"

concurrency:
  group: scrape-aztekc
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'Adams-anlyto'
    timeout-minutes: 330
    env:
      N8N_WEBHOOK_URL: ${{ secrets.NEW_N8N_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAX_PRODUCTS: ${{ inputs.max_products }}
          DRY_RUN: ${{ inputs.dry_run }}
          # FULL (real-stock) pass on the weekly cron, or when a manual run asks for it; otherwise
          # the daily light pass that carries stock forward.
          AZ_FULL: ${{ (github.event.schedule == '0 12 * * 0' || inputs.full == '1') && '1' || '' }}
          AZ_WORKERS: "12"
        run: python -u -m aztekc.scrape

      - name: Report result to n8n
        if: always() && env.N8N_WEBHOOK_URL != ''
        env:
          STATUS: ${{ steps.scrape.outcome }}
          ROWS: ${{ steps.scrape.outputs.rows }}
          PRODUCTS: ${{ steps.scrape.outputs.products }}
          IN_STOCK: ${{ steps.scrape.outputs.in_stock }}
          RESTOCKED: ${{ steps.scrape.outputs.restocked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Don't spend Actions minutes on a hung n8n (on 2026-10-13 it hung up to 2.5 min, then sent a 502)
          curl -sS --max-time 20 -X POST "$N8N_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"site\":\"aztekc\",\"status\":\"$STATUS\",\"rows\":\"$ROWS\",\"products\":\"$PRODUCTS\",\"in_stock\":\"$IN_STOCK\",\"restocked\":\"$RESTOCKED\",\"run_url\":\"$RUN_URL\"}" || echo "::warning::n8n did not answer within 20 s"
