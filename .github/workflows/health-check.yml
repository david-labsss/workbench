name: Health Check

# Daily scraper health check (ops/health_check.py): flags sites that never saved, stopped saving,
# or have poor price/image/description coverage. Runs after the morning scrape window so it sees
# the day's results; the report is in the run's Summary. Runs on one account (guarded); the
# scheduler skips it because it carries its own cron.

on:
  schedule:
    - cron: "0 8 * * *"      # 13:00 Asia/Karachi: the backup; n8n starts it on time (2026-11-22)
  workflow_dispatch:

permissions:
  actions: read      # once_per_round.py lists this workflow's runs
  contents: read

jobs:
  once:
    # The scrapers' n8n starts this job on time (GitHub's cron started it hours late); a scheduled
    # run after that does nothing (ops/once_per_round.py). Dispatched runs always go ahead.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'Adam-lab-maker'
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.once.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ops
      - id: once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW: health-check.yml
          ROUND_UTC: "08:00"
        run: python3 -u ops/once_per_round.py

  check:
    needs: once
    if: needs.once.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scraper health
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          READER_DATABASE_URL: ${{ secrets.READER_DATABASE_URL }}
        run: python -u ops/health_check.py
